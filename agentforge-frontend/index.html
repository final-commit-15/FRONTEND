<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a2e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- Primary Meta Tags -->
    <title>AgentForge — Your AI Project Manager for Startup Teams</title>
    <meta name="title" content="AgentForge — Your AI Project Manager for Startup Teams" />
    <meta name="description" content="AgentForge is an AI-powered project management platform for startup teams. Build, deploy, and manage AI agents with automated workflows, real-time analytics, and seamless integrations." />
    <meta name="keywords" content="AI agents, project management, automation, startup tools, workflow automation, artificial intelligence, team collaboration" />
    <meta name="author" content="AgentForge" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://agentforge-ai-page.vercel.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://agentforge-ai-page.vercel.app/" />
    <meta property="og:title" content="AgentForge — Your AI Project Manager for Startup Teams" />
    <meta property="og:description" content="Build, deploy, and manage AI agents with automated workflows, real-time analytics, and seamless integrations." />
    <meta property="og:image" content="https://agentforge-ai-page.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="AgentForge" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://agentforge-ai-page.vercel.app/" />
    <meta name="twitter:title" content="AgentForge — Your AI Project Manager for Startup Teams" />
    <meta name="twitter:description" content="Build, deploy, and manage AI agents with automated workflows, real-time analytics, and seamless integrations." />
    <meta name="twitter:image" content="https://agentforge-ai-page.vercel.app/og-image.png" />
    <meta name="twitter:site" content="@agentforge" />
    <meta name="twitter:creator" content="@agentforge" />

    <!-- Additional SEO -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AgentForge" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#1a1a2e" />

    <!-- Preconnect to API domain -->
    <link rel="preconnect" href="https://api.agentforge.example.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.agentforge.example.com" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Sitemap & Robots -->
    <link rel="sitemap" href="/sitemap.xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
